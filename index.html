<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7c6d0">
<meta name="description" content="Một vườn hồng rực rỡ gửi tặng tất cả những người phụ nữ nhân ngày 20/10.">
<title>Vườn hoa yêu thương · 20/10</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:#f8d7df;color:#fff}
.scene{position:relative;width:100%;height:100%;height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at center,#ffe7df 0,#f5b8cb 60%,#a85c7d 100%)}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transition:transform 2.4s ease,filter 2s ease;z-index:-2}
.scene:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(73,18,48,.06),transparent 35%,rgba(83,20,49,.12));pointer-events:none}
.play{position:absolute;left:50%;top:51.5%;transform:translate(-50%,-50%);width:clamp(76px,15vw,142px);aspect-ratio:1;border:3px solid rgba(255,255,255,.92);border-radius:50%;background:linear-gradient(145deg,#ff7ba5,#e91e63);box-shadow:0 0 0 10px #fff4,0 0 45px 12px #ff6d9eaa,inset 0 2px 8px #fff9;display:grid;place-items:center;cursor:pointer;z-index:4;animation:pulse 1.8s ease-in-out infinite}
.play svg{width:36%;height:36%;margin-left:7px;filter:drop-shadow(0 2px 3px #a31c53)}
.play:focus-visible{outline:4px solid #fff;outline-offset:9px}
.play span{position:absolute;top:calc(100% + 15px);white-space:nowrap;font:700 clamp(15px,2.5vw,20px)/1.2 Arial,sans-serif;color:#fff;text-shadow:0 2px 8px #85334f,0 0 14px #7d2b4a;letter-spacing:.02em}
@keyframes pulse{0%,100%{box-shadow:0 0 0 8px #fff3,0 0 35px 8px #ff6d9e99,inset 0 2px 8px #fff9;transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 0 16px #fff2,0 0 60px 18px #ff6d9ecc,inset 0 2px 8px #fff9;transform:translate(-50%,-50%) scale(1.06)}}
.tiny-title{position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:700 clamp(14px,2.2vw,21px)/1.3 Arial,sans-serif;letter-spacing:.23em;color:#fff8;text-shadow:0 2px 10px #75304b;pointer-events:none;z-index:2}
.greeting{position:absolute;z-index:6;top:17%;left:50%;width:min(92%,760px);transform:translate(-50%,-12px) scale(.92);text-align:center;opacity:0;pointer-events:none;display:flex;flex-direction:column;gap:clamp(7px,1.4vh,14px);font-family:Georgia,"Times New Roman",serif;color:#fff8e9;text-shadow:0 3px 5px #7b163e,0 0 18px #c82762,0 0 36px #ff8bb5;font-size:clamp(23px,4.3vw,48px);font-weight:bold;line-height:1.18;transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.greeting strong{font-size:clamp(34px,7vw,76px);color:#fff6d7;text-shadow:0 3px 3px #9c1e4d,0 0 24px #ff7cae}
.scene.playing .greeting{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.25s}
.hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;font:500 13px/1.4 Arial,sans-serif;letter-spacing:.04em;color:#fff9;text-shadow:0 2px 8px #71304a;z-index:2;pointer-events:none}
.petal,.sparkle,.heart{position:absolute;left:0;top:0;pointer-events:none;z-index:5;will-change:transform,opacity}
.petal{width:clamp(48px,9vw,110px);height:clamp(48px,9vw,110px);object-fit:cover;border-radius:50%;animation:fall var(--dur) linear forwards;filter:drop-shadow(0 5px 8px #8d244d77);border:1px solid #fff7}
@keyframes fall{0%{transform:translate3d(var(--x),-15vh,0) rotate(0deg) scale(.65);opacity:0}10%{opacity:1}100%{transform:translate3d(calc(var(--x) + var(--drift)),112vh,0) rotate(var(--spin)) scale(1.2);opacity:.12}}
.sparkle{color:#fff8a8;text-shadow:0 0 12px #fff,0 0 24px #ffb5d1;animation:twinkle var(--dur) ease-out forwards}
@keyframes twinkle{0%{transform:translate(var(--x),var(--y)) scale(.2) rotate(0);opacity:0}25%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.7) rotate(90deg);opacity:0}}
.heart{animation:floatheart var(--dur) ease-out forwards;filter:drop-shadow(0 3px 8px #c62f69aa)}
@keyframes floatheart{0%{transform:translate(var(--x),var(--y)) scale(.25) rotate(-12deg);opacity:0}15%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) - var(--dy))) scale(1.2) rotate(15deg);opacity:0}}
.scene.playing .backdrop{transform:scale(1.09);filter:saturate(1.15) brightness(1.04)}
.scene.playing .play{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.2);transition:opacity .5s,transform .7s}
.scene.playing .tiny-title{color:#fff;letter-spacing:.28em;transition:all 1.2s}
.replay{position:absolute;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:8;border:1px solid #ffffffa6;background:#7d2b4b66;color:white;border-radius:999px;padding:10px 15px;font:600 14px Arial,sans-serif;backdrop-filter:blur(8px);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.scene.playing .replay{opacity:1;pointer-events:auto}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="Vườn hoa chúc mừng ngày 20 tháng 10">
  <img class="backdrop" src="garden-20-10.png" alt="Khu vườn ngập tràn hoa hồng, cánh hoa bay và ánh sáng lung linh nhân ngày 20/10">
  <div class="tiny-title" aria-hidden="true">20 · 10</div>
  <button class="play" id="play" aria-label="Bấm để mở vườn hoa yêu thương">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M33 20 Q30 17 30 27 L30 73 Q30 83 39 77 L76 55 Q84 50 76 45 Z" fill="#fff"/></svg>
    <span>Chạm để nhận hoa 🌸</span>
  </button>
  <div class="greeting" id="greeting" aria-live="polite">
    <span>Chúc các mẹ, các cô, nyc, các chị...</span>
    <strong>có một 20/10</strong>
    <span>thật hạnh phúc 💗</span>
  </div>
  <div class="hint" id="hint">Một chút yêu thương dành tặng bạn · 20/10</div>
  <button class="replay" id="replay" type="button">↻ Ngắm lại từ đầu</button>
</main>
<script>
(() => {
 const scene=document.getElementById('scene'), play=document.getElementById('play'), replay=document.getElementById('replay'), hint=document.getElementById('hint');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const flowerCrops=[
  {x:'0%',y:'0%',size:'50%'},
  {x:'50%',y:'0%',size:'50%'},
  {x:'0%',y:'50%',size:'50%'},
  {x:'50%',y:'50%',size:'50%'}
 ];
 const sparkles=['✦','✧','✨','♡','❀','✿'];
 let timers=[];
 function clearEffects(){document.querySelectorAll('.petal,.sparkle,.heart').forEach(e=>e.remove());timers.forEach(clearTimeout);timers=[]}
 function addPetal(delay=0){
   timers.push(setTimeout(()=>{
    if(!scene.classList.contains('playing'))return;
    const e=document.createElement('img');e.className='petal';e.alt='';e.src='flower-fall-'+(1+Math.floor(Math.random()*4))+'.png';
    e.style.setProperty('--x',Math.random()*100+'vw');e.style.setProperty('--drift',((Math.random()-.5)*35)+'vw');e.style.setProperty('--spin',((Math.random()-.5)*1000)+'deg');e.style.setProperty('--dur',(6+Math.random()*7)+'s');scene.appendChild(e);timers.push(setTimeout(()=>e.remove(),14000));
   },delay));
 }
 function burst(){
   if(reduce)return;
   const w=innerWidth,h=innerHeight;
   for(let i=0;i<58;i++){
    const e=document.createElement('span');e.className=i%4===0?'heart':'sparkle';
    e.textContent=e.className==='heart'?['💗','💖','💕','💝'][Math.floor(Math.random()*4)]:sparkles[Math.floor(Math.random()*sparkles.length)];
    const x=(w*.12+Math.random()*w*.76), y=(h*.2+Math.random()*h*.55);
    e.style.fontSize=(14+Math.random()*32)+'px';e.style.setProperty('--x',x+'px');e.style.setProperty('--y',y+'px');e.style.setProperty('--dx',((Math.random()-.5)*200)+'px');e.style.setProperty('--dy',(60+Math.random()*200)+'px');e.style.setProperty('--dur',(1.8+Math.random()*2.5)+'s');scene.appendChild(e);timers.push(setTimeout(()=>e.remove(),5000));
   }
 }
 function start(){
   clearEffects();scene.classList.add('playing');hint.textContent='🌸🌷💗🌼💐';
   if(!reduce){burst();for(let i=0;i<130;i++)addPetal(i*45);for(let i=0;i<20;i++)timers.push(setTimeout(burst, i*650));}
 }
 function reset(){clearEffects();scene.classList.remove('playing');hint.textContent='Một chút yêu thương dành tặng bạn · 20/10';}
 play.addEventListener('click',start);replay.addEventListener('click',reset);
})();
</script>
</body>
</html>
